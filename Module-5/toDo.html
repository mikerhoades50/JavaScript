<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do</title>
</head>

<body>
    <h1>To Do</h1>
    <form action="#" method="get">
        <div class="form-row">
            <label>
                Todo Item Name:
                <input type="text" placeholder="Add a new task..." name="task">
            </label>
        </div>
        <div class="form-row">
            <label>
                Todo Due Date:
                <input type="date" placeholder="Due Date" name="dueDate">
            </label>
        </div>
        <button type="submit">Add</button>
    </form>
    <section class="js-container"></section>
    <section class="js-error-container"></section>
    <script src="./js/toDo.js"></script>
</body>

</html>
